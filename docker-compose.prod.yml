name: soulcuts

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    restart: unless-stopped
    env_file:
      - ${CADDY_ENV_FILE:-/opt/soulcuts/env/caddy.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default: {}
      api_ingress:
        ipv4_address: 172.30.41.2
    depends_on:
      public-site:
        condition: service_started
      blog:
        condition: service_started
      admin-app:
        condition: service_started
      shop:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

  public-site:
    image: ${PUBLIC_SITE_IMAGE:?PUBLIC_SITE_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${PUBLIC_SITE_ENV_FILE:-/opt/soulcuts/env/public-site.env}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  blog:
    image: ${BLOG_IMAGE:?BLOG_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${BLOG_ENV_FILE:-/opt/soulcuts/env/blog.env}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NODE_ENV: production
      NUXT_APP_BASE_URL: /blog/
      NUXT_PUBLIC_BLOG_SITE_URL: https://soulcuts.com.ua/blog
      NUXT_PUBLIC_SITE_URL: https://soulcuts.com.ua/blog
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/blog/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin-app:
    image: ${ADMIN_APP_IMAGE:?ADMIN_APP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${ADMIN_APP_ENV_FILE:-/opt/soulcuts/env/admin-app.env}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: /api/v1
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  shop:
    image: ${SHOP_IMAGE:?SHOP_IMAGE must be supplied after candidate acceptance}
    restart: unless-stopped
    env_file:
      - ${SHOP_ENV_FILE:-/opt/soulcuts/env/shop.env}
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_APP_BASE_URL: /shop/
      NUXT_API_BASE: http://backend:8000/api/v1
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_PUBLIC_DOBRODESK_ENABLED: "false"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/shop/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - ${POSTGRES_ENV_FILE:-/opt/soulcuts/env/postgres.env}
      - ${BACKEND_ENV_FILE:-/opt/soulcuts/env/backend.env}
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      UPLOAD_DIR: /app/data/uploads
      SENTRY_INCIDENT_STORE: /app/data/private/sentry-incidents/incidents.sqlite3
      CORS_ORIGINS: https://soulcuts.com.ua,https://www.soulcuts.com.ua,https://admin.soulcuts.com.ua
      CAMPAIGN_RUN_SCHEDULER_ENABLED: "true"
      CAMPAIGN_RUN_SCHEDULER_INTERVAL_SECONDS: "30"
      SMS_QUEUE_WORKER_ENABLED: "true"
      API_WORKERS: "1"
      MIGRATIONS_MODE: check
      BACKGROUND_WORKERS_ENABLED: "true"
      BACKGROUND_OWNER_HEARTBEAT_SECONDS: "5"
      CUSTOMER_ACTIVITY_NOTIFICATION_SCHEDULER_ENABLED: "true"
      TRUSTED_PROXY_IPS: 172.30.41.2
      SHOP_CHECKOUT_ENABLED: "false"
      SHOP_FISCAL_MOCK_ENABLED: "false"
      SHOP_CARRIER_RETURNS_MOCK_ENABLED: "false"
      SHOP_CHECKBOX_ENABLED: "false"
      SHOP_CHECKBOX_LIVE_TRANSPORT_ENABLED: "false"
      SHOP_NP_RETURNS_ENABLED: "false"
      SHOP_NP_RETURN_LIVE_TRANSPORT_ENABLED: "false"
      SHOP_PAYMENT_RESOLUTIONS_ENABLED: "false"
      PROVIDER_SANDBOX_ENABLED: "false"
      SANDBOX_PROVIDER_NETWORK_ENABLED: "false"
      MONOBANK_QR_MOCK_ENABLED: "false"
      CHECKBOX_ETTN_MOCK_ENABLED: "false"
      CHECKBOX_MOCK_ENABLED: "false"
      NP_MOCK_SHIPMENTS_ENABLED: "false"
      LOCAL_SALES_SIMULATION_ENABLED: "false"
      NP_TRACKING_ENABLED: "false"
    entrypoint: []
    command: ["sh", "/app/scripts/start.sh"]
    networks:
      default: {}
      api_ingress:
        ipv4_address: 172.30.41.3
        aliases:
          - api-ingress-backend
    expose:
      - "8000"
    volumes:
      - /opt/soulcuts/data/uploads:/app/data/uploads
      - type: bind
        source: /opt/soulcuts/data/sentry-incidents
        target: /app/data/private/sentry-incidents
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/public/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  booking-sms-reminders:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - ${POSTGRES_ENV_FILE:-/opt/soulcuts/env/postgres.env}
      - ${BACKEND_ENV_FILE:-/opt/soulcuts/env/backend.env}
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SENTRY_INCIDENT_STORE: /app/data/private/sentry-incidents/incidents.sqlite3
      CORS_ORIGINS: https://soulcuts.com.ua,https://www.soulcuts.com.ua,https://admin.soulcuts.com.ua
    command: >
      sh -c 'stopping=false;
      trap "stopping=true" TERM INT;
      while [ "$$stopping" = false ]; do
      python -m app.utils.send_booking_sms_reminders & child=$$!;
      wait "$$child" || true;
      if [ "$$stopping" = true ]; then wait "$$child" || true; exit 0; fi;
      sleep $${BOOKING_SMS_REMINDER_INTERVAL_SECONDS:-300} & child=$$!;
      wait "$$child" || true;
      done'
    entrypoint: []
    volumes:
      - type: bind
        source: /opt/soulcuts/data/sentry-incidents
        target: /app/data/private/sentry-incidents
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  migrate:
    profiles: [release]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ${POSTGRES_ENV_FILE:-/opt/soulcuts/env/postgres.env}
      - ${BACKEND_ENV_FILE:-/opt/soulcuts/env/backend.env}
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CORS_ORIGINS: https://soulcuts.com.ua,https://www.soulcuts.com.ua,https://admin.soulcuts.com.ua
      MIGRATIONS_MODE: check
      BACKGROUND_WORKERS_ENABLED: "false"
      PGCONNECT_TIMEOUT: "5"
      PGOPTIONS: "-c lock_timeout=5000 -c statement_timeout=300000"
    networks: [default]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:-/opt/soulcuts/env/postgres.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  api_ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.41.0/29

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
