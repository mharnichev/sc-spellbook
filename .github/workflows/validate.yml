name: Validate infra

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CADDY_ENV_FILE: env/caddy.env.example
      POSTGRES_ENV_FILE: env/postgres.env.example
      BACKEND_ENV_FILE: env/backend.env.example
      PUBLIC_SITE_ENV_FILE: env/public-site.env.example
      BLOG_ENV_FILE: env/blog.env.example
      ADMIN_APP_ENV_FILE: env/admin-app.env.example
      SHOP_ENV_FILE: env/shop.env.example
      SHOP_IMAGE: local/shop:validation-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backup and deployment safeguards
        run: |
          for script in scripts/deploy.sh scripts/restore-db.sh scripts/backup-db.sh scripts/backup-files.sh scripts/release-lock.sh scripts/verify-background-owner.sh scripts/accept-shop-pilot.sh scripts/rollback.sh scripts/run-english-backfill.sh; do
            bash -n "$script"
          done
          sh -n examples/backend/start.sh examples/backend/start-production.sh
          python3 -B -m unittest discover -s tests -v

      - name: Validate Docker Compose
        run: docker compose --env-file versions/production.env -f docker-compose.prod.yml config -q

      - name: Validate Caddyfile
        run: |
          digest=sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
          image=""
          for registry in public.ecr.aws/docker/library docker.io/library; do
            candidate="$registry/caddy:2.8-alpine@$digest"
            if docker pull "$candidate"; then
              image="$candidate"
              break
            fi
          done
          test -n "$image"
          docker run --rm --pull=never \
            -e ACME_EMAIL=admin@soulcuts.com.ua \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          RUN_CADDY_INTEGRATION=1 CADDY_TEST_IMAGE="$image" python3 -B -m unittest discover -s tests -p test_caddy_shop_pilot.py -v
